<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C5140" />
      <stop offset="100%" stop-color="#2A382D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3B3" />
      <stop offset="100%" stop-color="#C9A879" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Forest Green Rounded Square -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#DFE5D6" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="7" y="7" width="114" height="114" rx="29" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Serif RA Monogram Text -->
  <g filter="url(#subtleGlow)">
    <text 
      x="64" 
      y="84" 
      text-anchor="middle" 
      fill="#F7F5EE" 
      font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
      font-size="62" 
      font-weight="700" 
      letter-spacing="-1.5"
    >RA</text>
  </g>

  <!-- Small Champagne Accent Dot -->
  <circle cx="100" cy="80" r="4.5" fill="url(#goldGrad)" />
</svg>
